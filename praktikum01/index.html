<body>



<fieldset><p align="center"><strong>A Web Page</strong>

<!-- Form Pemesanan -->

<form action="index2.html" method="get">

<table cellpadding="5">

<tr>

<!-- Kolom kiri: kotak foto + tombol upload -->

<td valign="top" align="center">

<img src="" alt="" width="120" height="120" style="border:1px solid gray;">

<br><br>

<input type="button" value="Upload foto">

<!-- Kolom kanan: isian -->

<td> 

<table cellpadding="5">

<tr>

<td valign="top">Nama Barang :</td>

<td><input type="text" name="nama_barang" size="40"></td>

</tr>

<tr>

<td valign="top">Informasi Barang :</td>

<td><textarea name="info_barang" rows="4" cols="40"></textarea></td>

</tr>

<tr>

<td valign="top">Number Handphone :</td>

<td><input type="text" name="no_hp" value="+62" size="40"></td>

</tr>

<tr>

<td>Bank :</td>

<td>

<select name="bank">

<option value="seabank">seabank</option>

<option value="bca">BCA</option>

<option value="bni">BNI</option>

<option value="bri">BRI</option>

<option value="mandiri">Mandiri</option>

</select>

</td>

</tr>

<tr>

<td>Email :</td>

<td><input type="text" name="email" value="@gmail.com" size="40"></td>

</tr>

<tr>

<td valign="top">Transaksi :</td>

<td>

<input type="number" name="transaksi" value="1" min="1" max="100" style="width:50px;">

<br>

<small>if the transaction is for 3 person, choose 3 from drop-down list</small>

<br><br>

<input type="checkbox" name="kirim_hp" value="ya" checked> Send to Mobile Phone

<br>

<input type="checkbox" name="kirim_email" value="ya" checked> Send to Email

</td>

</tr>

<tr>

<td valign="top">Send to Mobile Phone :</td>

<td><input type="text" name="kirim_ke_hp" value="+62" size="40"></td>

</tr>

<tr>

<td valign="top">Send to Email :</td>

<td><input type="text" name="kirim_ke_email" value="@gmail.com" size="40"></td>

</tr>

<tr>

<td></td>

<td>

<input type="submit" value="Submit">

<input type="reset" value="Reset">

</tr>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengolahan Nilai Mahasiswa - Praktikum 6</title>
</head>
<body>
    <h2>Tugas Praktikum Mandiri Pekan 6 (Pengolahan Nilai Mahasiswa)</h2>
    <p>Buka tab Console pada Developer Tools (F12) untuk memeriksa hasil pengolahan nilai.</p>

    <script>
        const namaMahasiswa = "Abdullah Muhammad Ash Shiddiq";
        const nim = "0110226105";
        const nilaiTugas = 85;
        const nilaiUTS = 80;
        const nilaiUAS = 90;

        const nilaiAkhir = (nilaiTugas * 0.30) + (nilaiUTS * 0.30) + (nilaiUAS * 0.40);

        let statusKelulusan;
        if (nilaiAkhir >= 60) {
            statusKelulusan = "LULUS";
        } else {
            statusKelulusan = "TIDAK LULUS";
        }

        console.log("Nama Mahasiswa   :", namaMahasiswa);
        console.log("NIM              :", nim);
        console.log("Nilai Tugas (30%):", nilaiTugas);
        console.log("Nilai UTS (30%)  :", nilaiUTS);
        console.log("Nilai UAS (40%)  :", nilaiUAS);
        console.log("Nilai Akhir      :", nilaiAkhir);
        console.log("Status Kelulusan :", statusKelulusan);
    </script>
</body>
</html>
